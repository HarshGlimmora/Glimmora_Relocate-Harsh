[project]
name = "glimmora-backend"
version = "0.1.0"
description = "Glimmora Relocate — Mover-persona MVP backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "aiosqlite>=0.20.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.0.1",
  "python-docx>=1.1.2",
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "google-genai>=0.7.0",
  "google-auth>=2.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
