# Render Blueprint for Glimmora Relocate (MVP).
#
# Deploys ONE web service: the FastAPI backend. The Next.js consumer app
# is deployed separately to Vercel (see apps/consumer/).
#
# The backend runs `alembic upgrade head` on every boot from app/startup.py,
# so a redeploy is enough to apply pending migrations — no shell access needed.
#
# Secrets you MUST set in the Render dashboard before first deploy:
#   - DATABASE_URL                     (the **internal** Postgres URL from
#                                       your Render Postgres dashboard)
#   - JWT_SECRET                       (any 32+ char random string)
#   - GCP_SERVICE_ACCOUNT_JSON_B64     (base64 of GCP service account JSON)
#   - GCP_PROJECT                      (optional; auto-derived from the SA blob)

services:
  - type: web
    name: glimmora-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_PROVIDER
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
