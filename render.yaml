# Render Blueprint for Glimmora Relocate (MVP).
#
# Deploys two web services:
#   - glimmora-backend  (FastAPI, runs alembic upgrade head on boot)
#   - glimmora-consumer (Next.js, runs prisma db push on boot)
#
# Both apps self-configure their schema on every boot, so a redeploy with a
# fresh Postgres is enough to get a working stack — no shell access needed.
#
# Secrets you MUST set in the Render dashboard before first deploy:
#   backend:
#     - JWT_SECRET                       (any 32+ char random string)
#     - GCP_SERVICE_ACCOUNT_JSON_B64     (base64-encoded service account JSON)
#     - GCP_PROJECT                      (optional; auto-derived from the SA blob)
#   consumer:
#     - AUTH_SECRET                      (any 32+ char random string)
#
# The DATABASE_URL on each side is wired automatically from the matching
# Postgres database below.

services:
  - type: web
    name: glimmora-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_PROVIDER
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: glimmora-backend-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: web
    name: glimmora-consumer
    runtime: node
    plan: starter
    rootDir: apps/consumer
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glimmora-consumer-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: GLIMMORA_BACKEND_URL
        fromService:
          type: web
          name: glimmora-backend
          property: hostport

databases:
  - name: glimmora-backend-db
    plan: free
  - name: glimmora-consumer-db
    plan: free
